name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Download Zig
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' -OutFile $archive
          $expected = '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c'
          if ((Get-FileHash -LiteralPath $archive).Hash -ne $expected) { throw 'Zig checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.15.2' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build portable ZIP
        shell: pwsh
        run: ./build.ps1 -SelfContained
      - name: Launch and verify the extracted ZIP
        shell: pwsh
        run: ./tests/Test-Portable.ps1 -Archive ./artifacts/WindowCloud-win-x64-self-contained.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WindowCloud-win-x64-self-contained
          path: artifacts/WindowCloud-win-x64-self-contained.zip
          if-no-files-found: error
          compression-level: 0
